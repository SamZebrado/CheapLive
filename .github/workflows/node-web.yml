name: Node and Web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  node-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run assets:check
      - run: npm run test:unit
      - run: npm run test:signaling
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: '1'
