<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheapLive — 参赛演示 Demo</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --bg2: #111827;
      --text: #e8edf5;
      --text-muted: #8896b3;
      --accent: #4fc3f7;
      --accent2: #69db7c;
      --border: #2a3654;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .wrap {
      text-align: center;
      max-width: 520px;
      padding: 32px 24px;
    }
    .fish {
      font-size: 64px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: var(--accent);
      color: #0a0e1a;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(79, 195, 247, 0.4);
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #5a6a85;
    }
    .note a {
      color: var(--accent);
      text-decoration: none;
    }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="fish">🐟</div>
    <h1>CheapLive 3D 互动演示</h1>
    <p id="msg">
      <span class="loading"></span>
      正在打开新版 3D 萨卡班甲鱼互动演示……
    </p>
    <a class="btn" id="goBtn" href="contest-interactive-demo.html">
      进入 3D Demo →
    </a>
    <div class="note">
      如果没有自动跳转，请点击上方按钮。<br>
      旧版双端入口已整合到 <a href="contest-interactive-demo.html">新版 3D 互动演示</a>。
    </div>
  </div>
  <script>
    var target = 'contest-interactive-demo.html';
    var msg = document.getElementById('msg');
    var goBtn = document.getElementById('goBtn');
    var redirected = false;
    setTimeout(function () {
      if (!redirected) {
        redirected = true;
        try {
          window.location.replace(target);
        } catch (e) {
          msg.textContent = '浏览器阻止了自动跳转，请点击下方按钮进入。';
        }
      }
    }, 1200);
    goBtn.addEventListener('click', function () {
      redirected = true;
    });
  </script>
</body>
</html>
