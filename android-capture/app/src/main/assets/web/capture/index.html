<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CheapLive Capture</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0d18; color: #e8e8f0; font-family: system-ui, sans-serif; }
  #container { display: flex; flex-direction: column; height: 100vh; }
  video, canvas { width: 100%; height: auto; display: block; background: #000; }
  /* 隐藏摄像头预览，但保留 video 元素供 MediaPipe 取帧 */
  #webcam { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: -9999px; top: -9999px; }
  #output_canvas { display: none; }
  #hud { padding: 8px 12px; font-size: 12px; }
  #avatar { margin-top: 8px; }
  h3 { margin: 4px 0; }
  .voice-section { margin-top: 12px; padding-top: 8px; border-top: 1px solid #2a2a40; }
  .voice-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .voice-label { min-width: 80px; color: #8896b3; }
  .voice-value { font-family: monospace; color: #4fc3f7; }
  .voice-meter { flex: 1; height: 12px; background: #1a1a2e; border-radius: 6px; overflow: hidden; }
  .voice-meter-fill { height: 100%; background: linear-gradient(90deg, #4ade80, #fbbf24, #f87171); width: 0%; transition: width 0.05s linear; }
  .voice-btn { padding: 4px 10px; background: #1e3a5f; color: #93c5fd; border: 1px solid #3b82f6; border-radius: 4px; font-size: 12px; cursor: pointer; margin-right: 4px; }
  .voice-btn:active { background: #2563eb; }
  .voice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .voice-btn.stop { background: #5f1e1e; color: #fd9393; border-color: #f87171; }
  .preset-row { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
  .preset-btn { padding: 3px 8px; background: rgba(255,255,255,0.05); border: 1px solid #2a3654; border-radius: 4px; font-size: 11px; color: #8896b3; cursor: pointer; }
  .preset-btn.active { background: rgba(79,195,247,0.15); border-color: rgba(79,195,247,0.5); color: #4fc3f7; }
  .preset-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div id="container">
  <video id="webcam" playsinline autoplay muted></video>
  <canvas id="output_canvas"></canvas>
  <canvas id="avatar"></canvas>
  <div id="hud">
    <h3>面捕参数</h3>
    <div>eyeLeft: <span id="eyeLeft">1.00</span></div>
    <div>eyeRight: <span id="eyeRight">1.00</span></div>
    <div>mouthOpen: <span id="mouthOpen">0.00</span></div>
    <div>mouthSmile: <span id="mouthSmile">0.00</span></div>
    <div>headYaw: <span id="headYaw">0.00</span></div>
    <div>headPitch: <span id="headPitch">0.00</span></div>
    <div>headRoll: <span id="headRoll">0.00</span></div>
    <div>fps: <span id="fps">0</span></div>
    <div id="sessionInfo">—</div>
    <div class="voice-section">
      <h3>🎙️ 简易变声</h3>
      <div class="voice-row">
        <span class="voice-label">麦克风:</span>
        <span class="voice-value" id="voiceStatus">OFF</span>
        <button class="voice-btn" id="voiceStartBtn" onclick="startVoiceCapture()">启动</button>
        <button class="voice-btn stop" id="voiceStopBtn" onclick="stopVoiceCapture()" disabled>停止</button>
      </div>
      <div class="voice-row">
        <span class="voice-label">输入电平:</span>
        <div class="voice-meter"><div class="voice-meter-fill" id="micMeterFill"></div></div>
        <span class="voice-value" id="micLevelValue">0%</span>
      </div>
      <div class="voice-row">
        <span class="voice-label">处理后电平:</span>
        <div class="voice-meter"><div class="voice-meter-fill" id="processedMeterFill"></div></div>
        <span class="voice-value" id="processedLevelValue">0%</span>
      </div>
      <div class="preset-row">
        <button class="preset-btn active" data-preset="original" onclick="setVoicePreset('original')">原声</button>
        <button class="preset-btn" data-preset="cute" onclick="setVoicePreset('cute')">可爱</button>
        <button class="preset-btn" data-preset="robot" onclick="setVoicePreset('robot')">机器人</button>
        <button class="preset-btn" data-preset="deep" onclick="setVoicePreset('deep')">低沉</button>
        <button class="preset-btn" data-preset="radio" onclick="setVoicePreset('radio')">电台</button>
      </div>
      <div class="voice-row">
        <span class="voice-label">本地监听:</span>
        <button class="preset-btn" id="monitorBtn" onclick="toggleMonitor()" disabled>OFF</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { createSphereMesh, deformSphere, computeVertexLight, computeSphereFaceColor } from '/capture/sphere.js';
  import { createVoiceInputController } from '/capture/voice-effects.js';
  import { FaceLandmarker, FilesetResolver } from '/web/mediapipe/tasks-vision/vision_bundle.mjs';

  const videoElement = document.getElementById('webcam');
  const canvasElement = document.getElementById('output_canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const avatarCanvas = document.getElementById('avatar');
  const avatarCtx = avatarCanvas.getContext('2d');
  avatarCanvas.width = 480;
  avatarCanvas.height = 360;

  const hud = {
    eyeLeft: document.getElementById('eyeLeft'),
    eyeRight: document.getElementById('eyeRight'),
    mouthOpen: document.getElementById('mouthOpen'),
    mouthSmile: document.getElementById('mouthSmile'),
    headYaw: document.getElementById('headYaw'),
    headPitch: document.getElementById('headPitch'),
    headRoll: document.getElementById('headRoll'),
    fps: document.getElementById('fps'),
    session: document.getElementById('sessionInfo'),
  };

  // 简易人脸计算参数（不依赖完整 face_mesh）
  function computeParams(lm) {
    if (!lm || lm.length < 468) return null;
    // 左眼：点 159-145，右眼：386-374
    // 眼睛开合：distance ≈ 0.014 睁眼, ≈ 0.003 闭眼
    // 输出 0(闭) ~ 1(睁)
    const leftEyeOpen = Math.max(0, Math.min(1, (distance(lm[159], lm[145]) - 0.003) / 0.011));
    const rightEyeOpen = Math.max(0, Math.min(1, (distance(lm[386], lm[374]) - 0.003) / 0.011));
    // 嘴巴：13-14 垂直距离，distance ≈ 0.005 闭嘴, ≈ 0.04 张大嘴
    // 输出 0(闭) ~ 1(大张嘴)
    const mouth = Math.max(0, Math.min(1, (distance(lm[13], lm[14]) - 0.005) / 0.035));
    // 嘴角微笑：61-291 水平扩展与常态比
    const smile = Math.max(0, Math.min(1, (distance(lm[61], lm[291]) - 0.2) * 4));
    // 头部姿态：鼻尖相对脸部中心的偏移量除以脸宽
    const nose = lm[1];
    const leftCheek = lm[234];
    const rightCheek = lm[454];
    const centerX = (leftCheek.x + rightCheek.x) / 2;
    const faceWidth = Math.abs(leftCheek.x - rightCheek.x) || 0.3;
    const yaw = Math.max(-90, Math.min(90, (nose.x - centerX) / faceWidth * 90));
    // pitch: 用眼睛连线中点作为基准
    const leftEyeOuter = lm[33];
    const rightEyeOuter = lm[263];
    const eyesMidY = (leftEyeOuter.y + rightEyeOuter.y) / 2;
    const chin = lm[152];
    const faceHeight = Math.abs(chin.y - eyesMidY) || 0.2;
    const noseRelPos = (nose.y - eyesMidY) / faceHeight;
    const pitch = Math.max(-90, Math.min(90, (noseRelPos - 0.35) * 360));
    // roll: 两眼外角连线的倾斜角度
    const eyeDx = rightEyeOuter.x - leftEyeOuter.x;
    const eyeDy = rightEyeOuter.y - leftEyeOuter.y;
    const roll = Math.max(-60, Math.min(60, Math.atan2(eyeDy, eyeDx) * 180 / Math.PI));
    // 瞳孔/视线追踪：用虹膜中心相对眼白中心的偏移
    // 左眼虹膜：点 468-472（MediaPipe FaceMesh 左虹膜），右眼虹膜：点 473-477
    // 简化：用瞳孔点 468/473 相对眼眶中心的偏移估算 gaze
    const leftIris = lm[468];
    const rightIris = lm[473];
    const leftEyeCenter = { x: (lm[33].x + lm[133].x) / 2, y: (lm[33].y + lm[133].y) / 2 };
    const rightEyeCenter = { x: (lm[362].x + lm[263].x) / 2, y: (lm[362].y + lm[263].y) / 2 };
    const leftEyeWidth = Math.abs(lm[133].x - lm[33].x) || 0.05;
    const rightEyeWidth = Math.abs(lm[263].x - lm[362].x) || 0.05;
    const leftGazeX = leftIris ? Math.max(-1, Math.min(1, (leftIris.x - leftEyeCenter.x) / leftEyeWidth * 3)) : 0;
    const leftGazeY = leftIris ? Math.max(-1, Math.min(1, (leftIris.y - leftEyeCenter.y) / leftEyeWidth * 3)) : 0;
    const rightGazeX = rightIris ? Math.max(-1, Math.min(1, (rightIris.x - rightEyeCenter.x) / rightEyeWidth * 3)) : 0;
    const rightGazeY = rightIris ? Math.max(-1, Math.min(1, (rightIris.y - rightEyeCenter.y) / rightEyeWidth * 3)) : 0;
    // 头部位置：脸部中心相对画面中心的偏移（归一化 -1~1）
    // 注意：video 是镜像显示的（用户看到的是镜像），但 lm 坐标是原始帧
    // 这里直接用原始坐标，receiver 端会根据镜像关系调整
    const faceCenterX = centerX;
    const faceCenterY = (leftCheek.y + rightCheek.y) / 2;
    const faceX = Math.max(-1, Math.min(1, (faceCenterX - 0.5) * 2));
    const faceY = Math.max(-1, Math.min(1, (faceCenterY - 0.5) * 2));
    const faceScale = Math.max(0.5, Math.min(2, 0.25 / (faceWidth || 0.25)));

    return {
      eyeLeft: leftEyeOpen,
      eyeRight: rightEyeOpen,
      mouthOpen: mouth,
      mouthSmile: smile,
      browLeft: 0, browRight: 0,
      headYaw: yaw,
      headPitch: pitch,
      headRoll: roll,
      positionX: faceX,
      positionY: faceY,
      faceScale: faceScale,
      tailPitch: 0, tailYaw: 0, tailWave: 0,
      gazeLeftX: leftGazeX,
      gazeLeftY: leftGazeY,
      gazeRightX: rightGazeX,
      gazeRightY: rightGazeY,
    };
  }
  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0));
  }

  let seq = 0;
  let lastPush = 0;
  let sessionInfo = null;
  let publishEnabled = false; // 默认不发布，等待 AppState/startCamera 调用
  let cameraStarted = false;
  let cameraStream = null;

  // 全局 API：供原生按钮调用
  window.CheapLiveCapture = {
    startCamera: function(reason) {
      console.error('[CheapLiveCaptureDiag] start_camera reason=' + (reason || 'unknown'));
      publishEnabled = true;
      if (cameraStream && !cameraStarted) {
        // 已有 stream 但被暂停，恢复播放
        videoElement.play().then(() => {
          frameLoopRunning = false;
          startFrameLoop();
        }).catch(() => {});
        cameraStarted = true;
        return JSON.stringify({ ok: true, resumed: true });
      }
      if (cameraStarted) {
        // 摄像头已运行，但可能帧循环停了，确保启动
        if (!frameLoopRunning) {
          startFrameLoop();
        }
        return JSON.stringify({ ok: true, alreadyRunning: true });
      }
      // 首次启动
      startCameraInternal(reason || 'api');
      return JSON.stringify({ ok: true, starting: true });
    },
    stopCamera: function(reason, stopHardware) {
      console.error('[CheapLiveCaptureDiag] stop_camera reason=' + (reason || 'unknown') + ' stopHardware=' + (stopHardware ? 'true' : 'false'));
      publishEnabled = false;
      cameraStarted = false;
      frameLoopRunning = false;
      if (stopHardware && cameraStream) {
        try {
          // 停止所有视频轨道
          cameraStream.getTracks().forEach(function(track) {
            track.stop();
            console.error('[CheapLiveCameraDiag] track_stopped kind=' + track.kind + ' label=' + track.label + ' readyState=' + track.readyState);
          });
          cameraStream = null;
          // 彻底清理 video 元素
          videoElement.pause();
          videoElement.srcObject = null;
          try { videoElement.src = ''; } catch (e2) {}
          try { videoElement.load(); } catch (e3) {}
          console.error('[CheapLiveCameraDiag]', JSON.stringify({label: 'camera_hardware_stopped', reason: reason || 'unknown'}));
        } catch (e) {
          console.error('[CheapLiveCameraDiag]', JSON.stringify({label: 'stop_hardware_error', error: e.message}));
        }
      }
      return JSON.stringify({ ok: true, stopped: true, stopHardware: !!stopHardware, hasStream: !!cameraStream });
    },
    getState: function() {
      return JSON.stringify({
        publishEnabled: publishEnabled,
        cameraStarted: cameraStarted,
        hasStream: !!cameraStream,
        faceLandmarkerReady: faceLandmarkerReady,
        frameLoopRunning: frameLoopRunning,
        seq: seq
      });
    },
    // 音频控制 API
    startVoiceCapture: function(reason) {
      console.error('[CheapLiveVoiceDiag]', 'startVoiceCapture reason=' + (reason || 'unknown'));
      if (window.startVoiceCapture) {
        window.startVoiceCapture();
        return JSON.stringify({ ok: true, starting: true });
      }
      return JSON.stringify({ ok: false, error: 'voiceController not available' });
    },
    stopVoiceCapture: function(reason) {
      console.error('[CheapLiveVoiceDiag]', 'stopVoiceCapture reason=' + (reason || 'unknown'));
      if (window.stopVoiceCapture) {
        window.stopVoiceCapture();
        return JSON.stringify({ ok: true, stopped: true });
      }
      return JSON.stringify({ ok: false, error: 'voiceController not available' });
    },
    setVoicePreset: function(preset) {
      console.error('[CheapLiveVoiceDiag]', 'setVoicePreset preset=' + preset);
      if (window.setVoicePreset) {
        window.setVoicePreset(preset);
        return JSON.stringify({ ok: true, preset: preset });
      }
      return JSON.stringify({ ok: false, error: 'voiceController not available' });
    },
    getVoiceState: function() {
      if (window.__cheapLiveVoiceDiag && window.__cheapLiveVoiceDiag.getState) {
        return JSON.stringify(window.__cheapLiveVoiceDiag.getState());
      }
      return JSON.stringify({ error: 'voiceController not available' });
    }
  };

  function startCameraInternal(reason) {
    if (!navigator.mediaDevices?.getUserMedia) {
      console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'getUserMedia_unavailable'}));
      startFaceLandmarker();
      return;
    }
    console.error('[CheapLiveCameraDiag]', JSON.stringify({
      label:'getUserMedia_start', reason: reason, href:location.href,
      secure:window.isSecureContext, hasMD:!!navigator.mediaDevices, hasGUM:!!navigator.mediaDevices?.getUserMedia
    }));
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false })
      .then((stream) => {
        cameraStream = stream;
        cameraStarted = true;
        videoElement.srcObject = stream;
        videoElement.muted = true;
        videoElement.playsInline = true;
        console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'getUserMedia_resolve', streamId: stream.id, tracks: stream.getTracks().length}));
        videoElement.play().then(() => {
          console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'video_play_started', readyState: videoElement.readyState}));
        }).catch((e) => {
          console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'video_play_error', error: e.message || String(e)}));
        });
        videoElement.onloadeddata = () => {
          console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'video_loadeddata', readyState: videoElement.readyState, videoWidth: videoElement.videoWidth, videoHeight: videoElement.videoHeight}));
          startFaceLandmarker();
        };
        setTimeout(() => {
          if (!faceLandmarkerReady && videoElement.readyState >= 2) {
            console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'video_fallback_start', readyState: videoElement.readyState}));
            startFaceLandmarker();
          }
        }, 3000);
      })
      .catch((err) => {
        console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'getUserMedia_reject',error:err.name,message:err.message}));
        startFaceLandmarker();
      });
  }

  // 尝试从原生桥获取会话信息
  try {
    if (window.CheapLiveBridge && typeof window.CheapLiveBridge.getSessionInfo === 'function') {
      const json = window.CheapLiveBridge.getSessionInfo();
      sessionInfo = JSON.parse(json);
      hud.session.textContent = `sessionId=${sessionInfo.sessionId.slice(0,8)}… port=${sessionInfo.port}`;
    }
  } catch (e) { hud.session.textContent = '单机模式'; }

  function publish(p, source = 'unknown') {
    if (!window.CheapLiveBridge) return;
    if (!publishEnabled) return;
    const now = Date.now();
    if (now - lastPush < 33) return; // ~30Hz
    lastPush = now;
    try {
      const payload = JSON.stringify({
        type: 'face-frame',
        version: 1,
        sessionId: sessionInfo?.sessionId || '',
        seq: ++seq,
        timestamp: now,
        source: source,
        avatar: 'mesh-spindle-whale',
        params: p,
      });
      window.CheapLiveBridge.publishFaceFrame(payload);
      // A3 诊断：每次 publish 记录 seq/source/关键参数（低频，每 ~1s 一次）
      if (seq % 30 === 0) {
        console.error('[CheapLiveCaptureDiag] publish_face_frame seq=' + seq + ' source=' + source + ' headYaw=' + (p.headYaw || 0).toFixed(1) + ' headPitch=' + (p.headPitch || 0).toFixed(1) + ' headRoll=' + (p.headRoll || 0).toFixed(1) + ' mouthOpen=' + (p.mouthOpen || 0).toFixed(2) + ' eyeLeft=' + (p.eyeLeft || 0).toFixed(2) + ' eyeRight=' + (p.eyeRight || 0).toFixed(2) + ' gazeLX=' + (p.gazeLeftX || 0).toFixed(2));
      }
    } catch (e) {
      console.error('[CheapLiveCaptureDiag] publish_error error=' + (e.message || String(e)));
    }
  }

  // 程序化球体渲染（仅球，简化版）
  function drawSphere(ctx, w, h, params) {
    ctx.fillStyle = '#1A1A2E';
    ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    const radius = Math.min(w, h) * 0.25;
    ctx.fillStyle = '#e8e4d0';
    ctx.beginPath();
    ctx.arc(cx + params.positionX * 40, cy + params.positionY * 40, radius, 0, Math.PI * 2);
    ctx.fill();
    // 眼睛
    ctx.fillStyle = '#000';
    const eyeY = cy + params.positionY * 40;
    ctx.beginPath(); ctx.arc(cx - 25, eyeY - 5, Math.max(2, 6 * params.eyeLeft), 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 25, eyeY - 5, Math.max(2, 6 * params.eyeRight), 0, Math.PI * 2); ctx.fill();
    // 嘴巴
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath();
    if (params.mouthOpen > 0.1) {
      ctx.ellipse(cx, cy + 20, 8, 4 + params.mouthOpen * 12, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.moveTo(cx - 8, cy + 20); ctx.quadraticCurveTo(cx, cy + 20 + params.mouthSmile * 4, cx + 8, cy + 20);
      ctx.stroke();
    }
  }

  let lastFrame = null;
  let fpsStart = Date.now(), fpsCount = 0;

  let onResultsCount = 0;
  function onResults(results) {
    canvasElement.width = videoElement.videoWidth || 640;
    canvasElement.height = videoElement.videoHeight || 480;
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
    canvasCtx.restore();

    const lm = results.multiFaceLandmarks?.[0] || [];
    const params = computeParams(lm);
    onResultsCount++;
    // 一次性像素亮度诊断（前 5 帧）：确认摄像头画面有内容
    if (onResultsCount <= 5) {
      try {
        const cx = canvasElement.width / 2, cy = canvasElement.height / 2;
        const px = canvasCtx.getImageData(cx, cy, 1, 1).data;
        console.error('[CheapLiveCaptureDiag] video_pixel count=' + onResultsCount + ' center_rgba=(' + px[0] + ',' + px[1] + ',' + px[2] + ',' + px[3] + ') videoW=' + videoElement.videoWidth + ' currentTime=' + videoElement.currentTime.toFixed(2));
      } catch (e) {}
    }
    if (params) {
      hud.eyeLeft.textContent = params.eyeLeft.toFixed(2);
      hud.eyeRight.textContent = params.eyeRight.toFixed(2);
      hud.mouthOpen.textContent = params.mouthOpen.toFixed(2);
      hud.mouthSmile.textContent = params.mouthSmile.toFixed(2);
      hud.headYaw.textContent = params.headYaw.toFixed(0);
      hud.headPitch.textContent = params.headPitch.toFixed(0);
      drawSphere(avatarCtx, avatarCanvas.width, avatarCanvas.height, params);
      lastFrame = params;
      publish(params, 'real-camera');
    } else if (onResultsCount % 60 === 1) {
      // A3 诊断：无脸时周期记录 landmarks 长度
      console.error('[CheapLiveCaptureDiag] no_face_detected landmarks_len=' + lm.length + ' onResultsCount=' + onResultsCount);
    }
    fpsCount++;
    const dt = Date.now() - fpsStart;
    if (dt > 1000) {
      hud.fps.textContent = String(Math.round(fpsCount * 1000 / dt));
      fpsCount = 0; fpsStart = Date.now();
    }
  }

  // FaceLandmarker (Tasks API) 初始化 - 替代旧 FaceMesh
  let faceLandmarker = null;
  let faceLandmarkerReady = false;
  let frameLoopRunning = false;

  async function startFaceLandmarker() {
    console.error('[CheapLiveCameraDiag]', JSON.stringify({
       label:'startFaceLandmarker', videoReadyState:videoElement.readyState, modelAlreadyReady:faceLandmarkerReady
     }));
    // 如果模型已预加载，直接启动帧循环
    if (faceLandmarkerReady && faceLandmarker) {
      console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'faceLandmarker_already_ready'}));
      startFrameLoop();
      return;
    }
    try {
      const wasmBaseUrl = '/web/mediapipe/tasks-vision/wasm';
      const modelAssetPath = '/web/mediapipe/tasks-vision/face_landmarker.task';
      const filesetResolver = await FilesetResolver.forVisionTasks(wasmBaseUrl);
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: modelAssetPath,
          delegate: 'CPU',
        },
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: false,
        refineLandmarks: true,
        runningMode: 'VIDEO',
        numFaces: 1,
      });
      faceLandmarkerReady = true;
      console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'faceLandmarker_initialized'}));
      startFrameLoop();
    } catch (e) {
      console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'faceLandmarker_init_error', error: e.message || String(e)}));
      hud.session.textContent += '（FaceLandmarker 初始化失败，使用默认参数）';
      const fake = { eyeLeft: 1, eyeRight: 1, mouthOpen: 0, mouthSmile: 0, browLeft: 0, browRight: 0, headYaw: 0, headPitch: 0, headRoll: 0, positionX: 0, positionY: 0, scale: 1, tailPitch: 0, tailYaw: 0, tailWave: 0 };
      drawSphere(avatarCtx, avatarCanvas.width, avatarCanvas.height, fake);
      publish(fake, 'simulation');
    }
  }

  // 帧循环：使用 detectForVideo 直接从 videoElement 取帧
  let frameLoopDiagCount = 0;
  function startFrameLoop() {
    if (frameLoopRunning) return;
    frameLoopRunning = true;
    console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'frame_loop_start', videoReadyState: videoElement.readyState, videoWidth: videoElement.videoWidth, videoHeight: videoElement.videoHeight}));
    let lastVideoTime = -1;
    function tick() {
      if (!frameLoopRunning) return;
      try {
        if (faceLandmarkerReady && videoElement.readyState >= 2 && videoElement.videoWidth > 0) {
          const now = performance.now();
          if (videoElement.currentTime !== lastVideoTime) {
            lastVideoTime = videoElement.currentTime;
            const results = faceLandmarker.detectForVideo(videoElement, now);
            // 一次性结构诊断（前 3 帧 + 之后每 120 帧）
            frameLoopDiagCount++;
            if (frameLoopDiagCount <= 3 || frameLoopDiagCount % 120 === 0) {
              const fl = results.faceLandmarks;
              const flLen = Array.isArray(fl) ? (fl[0] ? fl[0].length : 0) : -1;
              console.error('[CheapLiveCaptureDiag] detect_result count=' + frameLoopDiagCount + ' currentTime=' + videoElement.currentTime.toFixed(3) + ' faceLandmarks_type=' + (fl === undefined ? 'undefined' : Array.isArray(fl) ? 'array[' + fl.length + ']' : typeof fl) + ' firstFace_len=' + flLen);
            }
            onResults({ multiFaceLandmarks: results.faceLandmarks || [] });
          }
        }
      } catch (e) {
        if (Math.random() < 0.05) console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'frame_loop_error', error: e.message || String(e)}));
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // 页面加载后只预热 FaceLandmarker 模型（不启动摄像头）
  // 摄像头只在 AppState/startCamera 明确要求时启动
  async function preloadFaceLandmarkerModel() {
    console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'preload_model_start'}));
    try {
      const wasmBaseUrl = '/web/mediapipe/tasks-vision/wasm';
      const modelAssetPath = '/web/mediapipe/tasks-vision/face_landmarker.task';
      const filesetResolver = await FilesetResolver.forVisionTasks(wasmBaseUrl);
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: {
          modelAssetPath: modelAssetPath,
          delegate: 'CPU',
        },
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: false,
        refineLandmarks: true,
        runningMode: 'VIDEO',
        numFaces: 1,
      });
      faceLandmarkerReady = true;
      console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'faceLandmarker_model_preloaded'}));
    } catch (e) {
      console.error('[CheapLiveCameraDiag]', JSON.stringify({label:'preload_model_error', error: e.message || String(e)}));
    }
  }
  preloadFaceLandmarkerModel();

  // ===== Voice effects integration =====
  const voiceUi = {
    status: document.getElementById('voiceStatus'),
    startBtn: document.getElementById('voiceStartBtn'),
    stopBtn: document.getElementById('voiceStopBtn'),
    micMeterFill: document.getElementById('micMeterFill'),
    micLevelValue: document.getElementById('micLevelValue'),
    processedMeterFill: document.getElementById('processedMeterFill'),
    processedLevelValue: document.getElementById('processedLevelValue'),
    monitorBtn: document.getElementById('monitorBtn'),
    presetBtns: document.querySelectorAll('.preset-btn[data-preset]')
  };

  const voiceController = createVoiceInputController({
    onMicLevel: (level) => {
      if (voiceUi.micMeterFill) voiceUi.micMeterFill.style.width = (level * 100) + '%';
      if (voiceUi.micLevelValue) voiceUi.micLevelValue.textContent = (level * 100).toFixed(1) + '%';
    },
    onProcessedLevel: (level) => {
      if (voiceUi.processedMeterFill) voiceUi.processedMeterFill.style.width = Math.min(100, level * 100) + '%';
      if (voiceUi.processedLevelValue) voiceUi.processedLevelValue.textContent = (level * 100).toFixed(1) + '%';
    },
    onStateChange: (state) => {
      updateVoiceUI(state);
      syncVoicePresetToBridge(state.effectMode);
    },
    onError: (msg) => {
      console.error('[CheapLiveVoiceDiag]', 'error:', msg);
      if (voiceUi.status) voiceUi.status.textContent = 'ERROR';
    }
  });

  function updateVoiceUI(state) {
    if (voiceUi.status) {
      voiceUi.status.textContent = state.running ? 'ON' : 'OFF';
      voiceUi.status.style.color = state.running ? '#4ade80' : '#8896b3';
    }
    if (voiceUi.startBtn) voiceUi.startBtn.disabled = state.running;
    if (voiceUi.stopBtn) voiceUi.stopBtn.disabled = !state.running;
    if (voiceUi.monitorBtn) {
      voiceUi.monitorBtn.disabled = !state.running;
      voiceUi.monitorBtn.textContent = state.monitorEnabled ? 'ON' : 'OFF';
      voiceUi.monitorBtn.classList.toggle('active', state.monitorEnabled);
    }
    voiceUi.presetBtns.forEach(btn => {
      const preset = btn.getAttribute('data-preset');
      btn.classList.toggle('active', preset === state.effectMode);
      btn.disabled = !state.running;
    });
  }

  function syncVoicePresetToBridge(effectMode) {
    if (window.CheapLiveBridge && typeof window.CheapLiveBridge.setVoicePreset === 'function') {
      try {
        window.CheapLiveBridge.setVoicePreset(effectMode);
      } catch (_) {}
    }
  }

  window.startVoiceCapture = async function() {
    try {
      await voiceController.start({ effectMode: voiceController.getState().effectMode });
    } catch (e) {
      console.error('[CheapLiveVoiceDiag]', 'start error:', e.message);
    }
  };

  window.stopVoiceCapture = function() {
    voiceController.stop();
  };

  window.setVoicePreset = function(preset) {
    voiceController.setEffectMode(preset);
  };

  window.toggleMonitor = function() {
    const state = voiceController.getState();
    voiceController.setMonitorEnabled(!state.monitorEnabled);
  };

  // Expose for debugging
  window.__cheapLiveVoiceDiag = {
    getState: () => voiceController.getState()
  };
</script>
</body>
</html>
