<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CheapLive Black Screen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
    }
    .hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      z-index: 10;
    }
    .hint.show { opacity: 0.2; }
    .hint.hide { opacity: 0; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div class="hint" id="hint">点击进入全屏黑屏</div>
  <script>
  (function() {
    var hint = document.getElementById('hint');
    var fullscreenAttempting = false;

    function isInFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
    }

    function enterFullscreen() {
      var el = document.documentElement;
      var p = null;
      if (el.requestFullscreen) {
        p = el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      } else if (el.mozRequestFullScreen) {
        el.mozRequestFullScreen();
      } else if (el.msRequestFullscreen) {
        el.msRequestFullscreen();
      }
      if (p && p.catch) p.catch(function() {});
    }

    function exitFullscreen() {
      if (document.exitFullscreen) {
        document.exitFullscreen().catch(function() {});
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }

    function toggleFullscreen() {
      // 防止快速重复调用（100ms 内）
      if (fullscreenAttempting) return;
      fullscreenAttempting = true;
      setTimeout(function() { fullscreenAttempting = false; }, 100);

      // 立即隐藏 hint
      hint.classList.remove('show');
      hint.classList.add('hide');

      if (isInFullscreen()) {
        exitFullscreen();
      } else {
        enterFullscreen();
      }
    }

    // 监听全屏状态变化
    function onFullscreenChange() {
      if (isInFullscreen()) {
        hint.style.display = 'none';
        document.body.style.cursor = 'none';
      }
    }
    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);
    document.addEventListener('mozfullscreenchange', onFullscreenChange);
    document.addEventListener('MSFullscreenChange', onFullscreenChange);

    // 只用 click 事件（mobile click 由 tap 合成，能正确触发 fullscreen）
    // 不用 touchend：部分 Android Chrome 版本不认 touchend 为 fullscreen 用户手势
    var lastInteraction = 0;
    function handleInteraction() {
      var now = Date.now();
      if (now - lastInteraction < 500) return; // 500ms 防抖，防止 touchend→click 双触发残留
      lastInteraction = now;
      toggleFullscreen();
    }

    document.addEventListener('click', handleInteraction, true);

    // 键盘也支持
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        handleInteraction();
      }
    });

    // Show hint briefly on load
    setTimeout(function() {
      hint.classList.add('show');
      setTimeout(function() {
        hint.classList.remove('show');
        hint.classList.add('hide');
      }, 2500);
    }, 300);
  })();
  </script>
</body>
</html>
